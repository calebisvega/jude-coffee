<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Book preview — Jude Coffee</title>
  <link rel="icon" href="/images/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/images/icon-mug-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=20261002book40">
  <link rel="stylesheet" href="/css/booking.css?v=20261002book40">
</head>
<body class="page-booking-preview">
  <p class="preview-note">Preview only — iPhone 16 frame <strong>393×852</strong> CSS pixels. Live Book is unchanged. <a href="/contact">Flashquotes</a> still runs in production.</p>

  <div class="booking-phone" id="booking-phone">
    <div class="booking-app" id="booking-app">
      <div class="booking-pane booking-pane--form">
        <div class="booking-status" aria-hidden="true">
          <span>9:41</span>
          <span class="booking-status__pill"></span>
          <span class="booking-status__icons"></span>
        </div>

        <header class="booking-top">
          <a class="booking-logo" href="/" aria-label="Jude — Home">
            <img src="/images/logo-cream.png" alt="" width="120" height="48">
          </a>
          <div class="booking-estimate" id="booking-estimate" aria-live="polite">
            <span class="booking-estimate__label" id="booking-estimate-label">Estimate</span>
            <span class="booking-estimate__value" id="booking-estimate-value">$0</span>
          </div>
          <div class="booking-tiers" id="booking-tiers" hidden>
            <button type="button" class="booking-tier__btn" data-tier="lean">Base</button>
            <button type="button" class="booking-tier__btn" data-tier="standard">Signature</button>
            <button type="button" class="booking-tier__btn" data-tier="premium">Curated</button>
          </div>
        </header>

        <div class="booking-stage" id="booking-stage"></div>

        <nav class="booking-nav" aria-label="Question">
          <div class="booking-nav__cluster">
            <button type="button" id="booking-prev" aria-label="Previous question" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
            </button>
            <p class="booking-nav__page" id="booking-page" hidden></p>
            <button type="button" id="booking-next" aria-label="Next question">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
            </button>
          </div>
        </nav>
        <div class="booking-home-bar" aria-hidden="true"></div>
      </div>

      <aside class="booking-pane booking-pane--media" aria-hidden="true">
        <div class="booking-media">
          <img src="/images/book-latte.jpg" alt="" width="1200" height="800" id="booking-media-img">
          <div class="booking-media__panel">
            <p class="booking-media__eyebrow" id="booking-media-eyebrow">Live estimate</p>
            <p class="booking-media__amount" id="booking-media-amount">—</p>
            <p class="booking-media__copy" id="booking-media-copy">Answer a few questions and the number fills in.</p>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="/js/booking-calculator.js?v=20261002book40"></script>
  <script src="/js/booking-form.js?v=20261002book40"></script>
</body>
</html>
