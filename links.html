<body class="page-links">
  <a href="#main" class="skip-link">Skip to content</a>

  <main id="main" class="links">
    <h1 class="visually-hidden">Jude Coffee</h1>

    <a class="links__btn" href="/contact" aria-label="Book Us">
      <img
        src="/images/links-book.jpg"
        alt=""
        width="910"
        height="483"
        decoding="async"
        fetchpriority="high"
      >
    </a>

    <a class="links__btn" href="/" aria-label="Visit our website">
      <img
        src="/images/links-website.jpg"
        alt=""
        width="907"
        height="492"
        decoding="async"
      >
    </a>

    <a
      class="links__btn"
      href="https://open.spotify.com/playlist/5MAvYbiZwAx9kOhmwSAB3z"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Jude's Tune on Spotify"
    >
      <img
        src="/images/links-tune.jpg"
        alt=""
        width="906"
        height="486"
        decoding="async"
      >
    </a>

    <a
      class="links__btn"
      href="https://www.google.com/searchviewer/10?output=search&svid=CAwSKRInCgNwdnESIE9oWXdlREE2TUhobE5EQXpZV0ptTnpKaVptUmhNalprGAo&hl=en&gl=US&safe=active"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Leave a Google review"
    >
      <img
        src="/images/links-review.jpg?v=20261017k1"
        alt=""
        width="908"
        height="488"
        decoding="async"
      >
    </a>

    <a
      class="links__ig"
      href="https://www.instagram.com/judeforall/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Jude Coffee on Instagram @judeforall"
    >@judeforall</a>
  </main>
